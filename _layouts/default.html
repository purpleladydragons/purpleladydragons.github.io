<!DOCTYPE html>
<html lang="en">
  <head>
    <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }} – {{ site.description }}</title>

    {% include meta.html %}

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,400;6..72,600&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }} - {{ site.description }}" href="{{ site.baseurl }}/feed.xml" />

    <!-- Created with Jekyll Now - http://github.com/barryclark/jekyll-now -->
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="site-shell">
      <header class="masthead paper-panel">
        <a href="{{ site.baseurl }}/" class="site-avatar" aria-label="{{ site.name | escape }} home"><img src="{{ site.avatar | replace: 'http://', 'https://' }}" alt="" width="44" height="44" /></a>

        <div class="site-info">
          {% if page.url == '/' %}
            <h1 class="site-name"><a href="{{ site.baseurl }}/">{{ site.name }}</a></h1>
          {% else %}
            <p class="site-name"><a href="{{ site.baseurl }}/">{{ site.name }}</a></p>
          {% endif %}
          <p class="site-description">{{ site.description }}</p>
        </div>

        <nav aria-label="Main navigation">
          <a href="{{ site.baseurl }}/"{% if page.url == '/' %} aria-current="page"{% endif %}>Blog</a>
          <a href="{{ site.baseurl }}/about/"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
        </nav>
      </header>

      <main id="main" tabindex="-1">
        {{ content }}
      </main>
    </div>

    {% include analytics.html %}
  </body>
</html>
